{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
    <div class="card auth-card">
        <span class="eyebrow">GET STARTED</span>
        <h1>Create your account</h1>
        <p class="muted">It only takes a minute to get started.</p>
        <form method="POST">
            <label for="name">Full Name</label>
            <input id="name" name="name" maxlength="100" autocomplete="name" placeholder="Enter your name" required>
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" maxlength="150" autocomplete="email" placeholder="Enter your email" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required>
            <button class="button button-full" type="submit">Create Account</button>
        </form>
        <p class="form-bottom">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</section>
{% endblock %}
